name: HLSDownloader
options:
  bundleIdPrefix: com.xiaokaig
  deploymentTarget:
    iOS: "16.0"
  generateEmptyDirectories: true

packages:
  VLCKit:
    url: https://github.com/rsalesas/VLCKit.git
    from: 3.6.6

targets:
  HLSDownloader:
    type: application
    platform: iOS
    sources:
      - path: Sources
    resources:
      - path: Assets.xcassets
    dependencies:
      - package: VLCKit
    info:
      path: Support/Info.plist
      properties:
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIUserInterfaceStyle: Automatic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xiaokaig.hlsdownloader
        PRODUCT_NAME: HLSDownloader
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        CODE_SIGNING_ALLOWED: NO
