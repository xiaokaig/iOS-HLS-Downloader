name: HLSDownloader
options:
  bundleIdPrefix: com.xiaokaig
  deploymentTarget:
    iOS: "16.0"
  generateEmptyDirectories: true

targets:
  HLSDownloader:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Support/Info.plist
      properties:
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIUserInterfaceStyle: Automatic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xiaokaig.hlsdownloader
        PRODUCT_NAME: HLSDownloader
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        CODE_SIGNING_ALLOWED: NO
