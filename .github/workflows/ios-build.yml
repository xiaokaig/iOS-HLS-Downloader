name: iOS Build

on:
  push:
    branches: [main, browser-rewrite]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE_PATH="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1)"
          if [ -n "$XCODE_PATH" ]; then sudo xcode-select -s "$XCODE_PATH/Contents/Developer"; fi
          xcodebuild -version

      - name: Install XcodeGen and SVG renderer
        run: brew install xcodegen librsvg

      - name: Generate app icon
        run: |
          rsvg-convert -w 1024 -h 1024 Assets.xcassets/AppIcon.appiconset/AppIcon.svg -o Assets.xcassets/AppIcon.appiconset/AppIcon.png
          test -s Assets.xcassets/AppIcon.appiconset/AppIcon.png

      - name: Generate project
        run: xcodegen generate

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project HLSDownloader.xcodeproj -scheme HLSDownloader

      - name: Build for iPhone (unsigned)
        run: |
          xcodebuild \
            -project HLSDownloader.xcodeproj \
            -scheme HLSDownloader \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            INFOPLIST_KEY_InternalGitCommit="${GITHUB_SHA:0:7}" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify compiled app icon
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/HLSDownloader.app"
          test -s "$APP_PATH/Assets.car"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIconName' "$APP_PATH/Info.plist" | grep -qx 'AppIcon'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist" | grep -qx "$GITHUB_RUN_NUMBER"
          /usr/libexec/PlistBuddy -c 'Print :InternalGitCommit' "$APP_PATH/Info.plist" | grep -qx "${GITHUB_SHA:0:7}"

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/HLSDownloader.app"
          test -d "$APP_PATH"
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build
          /usr/bin/zip -qry HLSDownloader-unsigned.ipa Payload

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: HLSDownloader-unsigned-ipa
          path: build/HLSDownloader-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
